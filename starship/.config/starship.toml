# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

# Disable AWS
[aws]
disabled = true

[gcloud]
disabled = true

# Avoid running language version probes while rendering every prompt.
[python]
disabled = true

[ruby]
disabled = true

[bun]
disabled = true
